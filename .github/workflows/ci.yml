name: CI — TalkBox Reference

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # The DSP engine has no dependencies, so it is tested directly with g++.
  # This is the suite behind the "40/40 PASS" claim.
  # ---------------------------------------------------------------------------
  dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run headless DSP tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -I src/dsp tests/test_main.cpp -o tests/run_tests
          ./tests/run_tests | tee /tmp/test_output.txt
          grep -q "Summary: PASS=40 FAIL=0" /tmp/test_output.txt
      - name: Upload test output
        if: always()
        run: ./tests/run_tests > artifacts/test_output.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: artifacts/test_output.txt

  cmake-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (DSP-only, no JUCE)
        run: cmake -B build -DTB_BUILD_JUCE=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: CTest
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Compiles the JUCE plugin. Before this job existed, CMakeLists.txt passed a
  # non-existent CLAP format and the editor/processor called JUCE APIs that do
  # not exist in 7.0.12 (AudioProcessorValueTreeState::Layout, MouseInput,
  # Graphics::drawArc, AudioChannelLayout, ...). None of that was caught because
  # the only build job used -DTB_BUILD_JUCE=OFF, so src/plugin/ was never
  # compiled. This job exists so it can never regress silently again.
  # ---------------------------------------------------------------------------
  plugin-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libfreetype6-dev libcurl4-openssl-dev \
            libwebkit2gtk-4.1-dev pkg-config

      - name: Pin JUCE 7.0.12
        run: git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE third_party/JUCE

      - name: Configure with JUCE
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DTB_BUILD_JUCE=ON -DJUCE_PATH=third_party/JUCE

      # Tee the build so a failure can be surfaced as an annotation: the raw
      # Actions log lives on Azure Blob and is not always retrievable.
      - name: Build VST3 and Standalone
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2 2>&1 | tee /tmp/build.log || {
            echo "=== BUILD FAILED ==="
            # First real compiler / linker errors, as annotations.
            n=0
            grep -nE "error:|undefined reference|Error [0-9]" /tmp/build.log | head -20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            echo "=== last 60 lines ==="
            tail -60 /tmp/build.log
            exit 1
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-build-log
          path: /tmp/build.log

      # Assert the real artefact layout rather than guessing names, and print
      # what was actually produced so the log is self-documenting.
      - name: Confirm the expected artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          ART="build/TalkBoxReference_artefacts/Release"
          find "$ART" -maxdepth 3 -mindepth 1 -printf '%y %p\n' | sort
          vst3_count=$(find "$ART/VST3" -maxdepth 1 -name '*.vst3' -type d | wc -l)
          echo "VST3 bundles: $vst3_count"
          test "$vst3_count" -ge 1
          test -n "$(find "$ART/Standalone" -maxdepth 1 -type f -perm -u+x -print -quit)"
          echo "VST3 and Standalone artefacts present."
